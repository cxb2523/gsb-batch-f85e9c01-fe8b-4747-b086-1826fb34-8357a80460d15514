<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Export snapshot and lock end-to-end verification</title>
</head>
<body data-status="running">
<iframe id="app" src="../index.html?gifTimeoutMs=900" width="1200" height="800"
        style="border:1px solid #333"></iframe>
<pre id="result">Checking export snapshot and lock paths in the real app…</pre>
<script type="module">
const failures = [];
const checks = [];
const unhandled = [];
window.addEventListener('unhandledrejection', (event) => {
    unhandled.push(String(event.reason?.message || event.reason));
});
window.addEventListener('error', (event) => {
    // React committed app errors to the report instead of failing silently.
    if (event.message) failures.push(`window error: ${event.message}`);
});

const check = (name, condition, detail = '') => {
    checks.push({ name, passed: Boolean(condition), detail });
    if (!condition) failures.push(`${name}${detail ? `: ${detail}` : ''}`);
};

const iframe = document.querySelector('#app');
const waitFor = async (predicate, timeoutMs = 15000, stepMs = 40) => {
    const deadline = performance.now() + timeoutMs;
    while (performance.now() < deadline) {
        try {
            if (await predicate()) return true;
        } catch {
            // iframe not ready yet
        }
        await new Promise((resolve) => setTimeout(resolve, stepMs));
    }
    return false;
};

const canvasSignature = (win) => {
    const canvas = win.document.querySelector('#fxCanvas');
    const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    let alpha = 0;
    let hash = 2166136261;
    for (let index = 0; index < data.length; index += 4) {
        alpha += data[index + 3];
        hash = Math.imul(hash ^ (data[index] + data[index + 1] * 3 + data[index + 2] * 7 + data[index + 3] * 11), 16777619);
    }
    return { alpha, hash: hash >>> 0 };
};

try {
    await new Promise((resolve, reject) => {
        iframe.addEventListener('load', resolve, { once: true });
        iframe.addEventListener('error', reject, { once: true });
    });
    const win = iframe.contentWindow;
    const doc = iframe.contentDocument;

    await waitFor(() => doc.querySelector('#fxCanvas') && doc.querySelector('#motifSelect')?.options.length > 0);
    const canvas = doc.querySelector('#fxCanvas');
    check('app boots with a canvas', Boolean(canvas));
    check('app boots with motif options', doc.querySelector('#motifSelect').options.length >= 50,
        `options=${doc.querySelector('#motifSelect').options.length}`);

    // Stub downloads and capture generated blobs.
    const captured = [];
    win.__captured = captured;
    const realCreateObjectURL = win.URL.createObjectURL.bind(win.URL);
    win.URL.createObjectURL = (blob) => {
        captured.push(blob);
        return realCreateObjectURL(blob);
    };
    win.HTMLAnchorElement.prototype.click = function () {};

    const exportButtons = [...doc.querySelectorAll('#exportAtlasBtn, #exportFramesBtn, #exportGifBtn')];
    check('three export buttons exist', exportButtons.length === 3);
    const allEnabled = () => exportButtons.every((button) => !button.disabled);
    check('buttons start enabled', allEnabled());

    // --- 1. Changing a control updates the live preview. --------------------
    // The first animation frames may still be blank right after boot, so wait
    // for a painted frame before sampling the baseline signature.
    await waitFor(() => canvasSignature(win).alpha > 0);
    const signatureBefore = canvasSignature(win);
    const motifSelect = doc.querySelector('#motifSelect');
    check('preview draws a non-empty frame', signatureBefore.alpha > 0,
        `alpha=${signatureBefore.alpha}`);
    const firstOption = [...motifSelect.options].find((option) => option.value !== motifSelect.value);
    const originalMotif = motifSelect.value;
    motifSelect.value = firstOption.value;
    motifSelect.dispatchEvent(new win.Event('change', { bubbles: true }));

    const previewChanged = await waitFor(() => {
        const signature = canvasSignature(win);
        return signature.alpha > 0 && signature.hash !== signatureBefore.hash;
    });
    check('preview updates after a motif change', previewChanged);
    check('motif control retains the user selection', motifSelect.value === firstOption.value);

    const readActiveMotif = () => doc.querySelector('#motifSelect').value;

    // --- 2. ZIP export uses the snapshot taken at start. --------------------
    {
        const startMotif = readActiveMotif();
        const startFrameCount = Number(doc.querySelector('#frameCountSelect').value);
        captured.length = 0;
        doc.querySelector('#exportFramesBtn').click();
        check('export immediately disables the buttons', !allEnabled());
        // Change the recipe while frames are rendering/encoding.
        const changed = [...motifSelect.options].find((option) => option.value !== startMotif);
        motifSelect.value = changed.value;
        motifSelect.dispatchEvent(new win.Event('change', { bubbles: true }));
        check('motif changed during export', readActiveMotif() !== startMotif);

        const gotZip = await waitFor(() => captured.some((blob) => blob.type === 'application/zip'), 30000);
        check('zip export produced a blob', gotZip);
        const zipBlob = captured.find((blob) => blob.type === 'application/zip');
        if (zipBlob) {
            const JSZip = win.JSZip;
            const zip = await JSZip.loadAsync(zipBlob);
            const recipeText = await zip.file('recipe.json').async('string');
            const recipe = JSON.parse(recipeText);
            check('recipe.json matches the recipe at export start', recipe.motif === startMotif,
                `recipe.motif=${recipe.motif} start=${startMotif}`);
            check('recipe.json is not the recipe changed mid-export', recipe.motif !== readActiveMotif(),
                `current=${readActiveMotif()}`);
            const frameFiles = Object.keys(zip.files).filter((name) => name.startsWith('frame-'));
            check('zip contains the requested frame count', frameFiles.length === startFrameCount,
                `frames=${frameFiles.length} expected=${startFrameCount}`);
        }
        const reEnabled = await waitFor(allEnabled, 30000);
        check('buttons re-enable after a successful export', reEnabled);
        check('UI still shows the newest motif after export', readActiveMotif() === changed.value);
    }

    // --- 3. Atlas export failure releases the lock. -------------------------
    {
        const canvasProto = win.HTMLCanvasElement.prototype;
        const originalToBlob = canvasProto.toBlob;
        // Force the PNG encoding step to fail for this export only.
        canvasProto.toBlob = function (callback) { callback(null); };
        captured.length = 0;
        doc.querySelector('#exportAtlasBtn').click();
        check('failed export holds the lock while running', !allEnabled());
        const reEnabled = await waitFor(allEnabled, 15000);
        canvasProto.toBlob = originalToBlob;
        check('buttons re-enable after a failed export', reEnabled);
        const noticeText = doc.querySelector('#notice').textContent;
        check('failure is reported to the user', /export failed/i.test(noticeText), noticeText);

        // The button must be clickable again: a second export should start.
        captured.length = 0;
        doc.querySelector('#exportAtlasBtn').click();
        const startedAgain = await waitFor(() => captured.length > 0, 30000);
        await waitFor(allEnabled, 30000);
        check('a second export can be started after failure', startedAgain,
            `captured=${captured.length}`);
    }

    // --- 4. GIF timeout releases the lock (no abort event from the encoder). --
    {
        const originalGif = win.GIF;
        // A GIF stand-in that never emits "finished" or "abort"; abort() is a
        // no-op. Only the watchdog can free the lock in this scenario.
        win.GIF = class StalledGif {
            constructor() { this.handlers = {}; }
            on(event, callback) { this.handlers[event] = callback; }
            addFrame() {}
            abort() {}
            render() {}
        };
        const noticeBefore = doc.querySelector('#notice').textContent;
        captured.length = 0;
        doc.querySelector('#exportGifBtn').click();
        check('stalled GIF export holds the lock', !allEnabled());
        const reEnabled = await waitFor(allEnabled, 8000);
        check('buttons re-enable after a GIF timeout', reEnabled);
        const noticeText = doc.querySelector('#notice').textContent;
        check('timeout is reported to the user', /timed out/i.test(noticeText)
            && noticeText !== noticeBefore, noticeText);
        check('a timed-out GIF exported nothing', captured.length === 0,
            `captured=${captured.length}`);

        // The lock is gone, so the same button can run again.
        captured.length = 0;
        doc.querySelector('#exportGifBtn').click();
        const restarted = await waitFor(() => !allEnabled(), 5000) || await waitFor(allEnabled, 8000);
        await waitFor(allEnabled, 8000);
        check('GIF export can be retried after timeout', restarted);
        win.GIF = originalGif;
    }

    // --- 5. GIF success releases the lock and downloads one blob. -----------
    {
        win.GIF = class InstantGif {
            constructor() { this.handlers = {}; }
            on(event, callback) { this.handlers[event] = callback; }
            addFrame() {}
            abort() { if (this.handlers.abort) this.handlers.abort(); }
            render() {
                if (this.handlers.finished) {
                    this.handlers.finished(new win.Blob(['GIF89a'], { type: 'image/gif' }));
                }
            }
        };
        captured.length = 0;
        doc.querySelector('#exportGifBtn').click();
        const gotGif = await waitFor(() => captured.some((blob) => blob.type === 'image/gif'), 30000);
        check('successful GIF export produced a blob', gotGif);
        const reEnabled = await waitFor(allEnabled, 30000);
        check('buttons re-enable after a successful GIF export', reEnabled);
        const noticeText = doc.querySelector('#notice').textContent;
        check('success is reported to the user', /exported/i.test(noticeText), noticeText);
    }

    check('no unhandled rejections in the harness', unhandled.length === 0, unhandled.join(' | '));
} catch (error) {
    failures.push(`harness exception: ${error.message}`);
    check('harness completed without exceptions', false, error.stack?.slice(0, 500));
}

const result = { passed: failures.length === 0, failures, checks, unhandledRejections: unhandled };
document.body.dataset.status = result.passed ? 'passed' : 'failed';
document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
</script>
</body>
</html>
