# Abyssal Infinite on OpenResty: the game's page and its multiplayer server (sea.lua) under one host.
# An example to include at the http level (sites/sea.example.com.conf): change the host's name, the certificate
# and the paths to your own:
#   /var/www/sea.example.com/public/index.html   the game (server/public/index.html after `npm run build`)
#   /var/www/sea.example.com/sea.lua             the sea (outside the web root: it is not served)
# Needs OpenResty (or nginx with lua-nginx-module, lua-resty-websocket, lua-cjson and LuaJIT). Nothing else of the
# server's configuration is touched: no init_by_lua, no lua_package_path, only the three zones below.
# Behind a proxy or a CDN, make nginx restore the visitor's own address first (set_real_ip_from, real_ip_header):
# the limits per address below count $binary_remote_addr, and would otherwise count the proxy's addresses.

# the sea itself, shared by nginx's workers: about 150 bytes a player, so 2 MB is far more than it takes
lua_shared_dict abyssal_sea 2m;
# per address: connections open at once, and new connections a second
limit_conn_zone $binary_remote_addr zone=abyssal_conn:1m;
limit_req_zone $binary_remote_addr zone=abyssal_join:1m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sea.example.com;

    ssl_certificate /etc/letsencrypt/live/sea.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sea.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/sea.example.com/public;

    # players in the sea at once (sea.lua: 300 without this line)
    set $abyssal_max 300;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # the WebSocket: the Lua code takes the connection over
    location = /ws {
        access_log off;
        limit_conn abyssal_conn 8;
        limit_req zone=abyssal_join burst=10 nodelay;
        lua_socket_log_errors off;
        content_by_lua_file /var/www/sea.example.com/sea.lua;
    }
    location = /status {
        access_log off;
        limit_req zone=abyssal_join burst=20 nodelay;
        content_by_lua_file /var/www/sea.example.com/sea.lua;
    }
    # every other address is the game: one file
    location / {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
