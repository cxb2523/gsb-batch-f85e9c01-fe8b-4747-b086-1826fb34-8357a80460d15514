# For trying sea.lua at home in Docker (see ../../README.md): plain http on port 8080, several workers, the limits
# of the protocol test (100 players, and no limit per address, since the test's players all come from one).
worker_processes 4;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    lua_shared_dict abyssal_sea 2m;
    server {
        listen 8080;
        root /sea/public;
        set $abyssal_max 100;
        location = /ws { lua_socket_log_errors off; content_by_lua_file /sea/sea.lua; }
        location = /status { content_by_lua_file /sea/sea.lua; }
        location / { default_type text/html; try_files /index.html =404; }
    }
}
